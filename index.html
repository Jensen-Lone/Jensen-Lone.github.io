<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Jensen Music</title>

    <link rel="stylesheet"
        href="./css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
		
		
	<!-- PWA -->

	<link
		rel="manifest"
		href="./manifest.json">

	<meta
		name="theme-color"
		content="#07131d">

	<!-- iPhone -->

	<meta
		name="apple-mobile-web-app-capable"
		content="yes">

	<meta
		name="apple-mobile-web-app-status-bar-style"
		content="black-translucent">

	<meta
		name="apple-mobile-web-app-title"
		content="Jensen Music">

	<link
		rel="apple-touch-icon"
		href="./icons/icon-192.png">	

</head>

<body>

    <!-- 背景 -->
    <div class="bg-overlay"></div>

    <!-- 隐藏水印 -->
    <div class="watermark-hidden">
        All rights reserved Jensen-Lone
    </div>

    <div class="layout">

        <!-- 左侧 -->
        <aside class="sidebar">

            <h1 id="logoBtn">
				Jensen Music
			</h1>

            <input
                id="searchInput"
                type="text"
                placeholder="search music">

            <div id="genreList"></div>

        </aside>

        <!-- 主区域 -->
        <main class="main-content">

            <div
                id="songContainer"
                class="song-grid">
            </div>

        </main>

    </div>

    <!-- 底部播放器 -->
    <div
        class="bottom-player"
        id="bottomPlayer">

        <div class="player-left">

            <img id="playerCover">

            <div>

                <h3 id="playerTitle">
                    Not played
                </h3>

                <p id="playerArtist">
                    Jensen-Lone
                </p>

            </div>

        </div>

        <div class="player-center">

            <div class="controls">

                <button id="prevBtn">
                    <i class="fas fa-backward"></i>
                </button>

                <button id="playBtn">
                    <i class="fas fa-play"></i>
                </button>

                <button id="nextBtn">
                    <i class="fas fa-forward"></i>
                </button>

            </div>

            <div class="progress-wrap">

                <span id="currentTime">
                    00:00
                </span>

                <input
                    type="range"
                    id="progressBar"
                    value="0"
                    min="0"
                    max="100">

                <span id="duration">
                    00:00
                </span>

            </div>

            <!-- 真频谱 -->
            <canvas id="visualizer"></canvas>

        </div>

    </div>

    <audio 
		id="audioPlayer"
		preload="metadata">
	</audio>

    <script src="./js/main.js"></script>

</body>

</html>
