<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Jensen Music</title>

    <link rel="stylesheet"
        href="./css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- 北极光背景 -->
    <div class="aurora-bg"></div>

    <div class="layout">

        <!-- 左侧栏 -->
        <aside class="sidebar">

            <h1>Jensen Music</h1>

            <input
                type="text"
                id="searchInput"
                placeholder="搜索音乐">

            <div id="genreList"></div>

        </aside>

        <!-- 主区域 -->
        <main class="main-content">

            <div id="songContainer"
                class="song-grid">
            </div>

        </main>

    </div>

    <!-- 底部播放器 -->
    <div class="bottom-player"
        id="bottomPlayer">

        <div class="player-left">

            <img id="playerCover">

            <div>

                <h3 id="playerTitle">
                    未播放
                </h3>

                <p id="playerArtist">
                    Jensen Music
                </p>

            </div>

        </div>

        <div class="player-center">

            <div class="controls">

                <button id="prevBtn">
                    <i class="fas fa-backward"></i>
                </button>

                <button id="playBtn">
                    <i class="fas fa-play"></i>
                </button>

                <button id="nextBtn">
                    <i class="fas fa-forward"></i>
                </button>

            </div>

            <div class="progress-wrap">

                <span id="currentTime">
                    00:00
                </span>

                <input type="range"
                    id="progressBar"
                    value="0"
                    min="0"
                    max="100">

                <span id="duration">
                    00:00
                </span>

            </div>

            <!-- 波形 -->
            <canvas id="waveCanvas"></canvas>

        </div>

    </div>

    <audio id="audioPlayer"></audio>

    <script src="./js/main.js"></script>

</body>

</html>
