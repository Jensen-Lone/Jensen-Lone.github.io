<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <!-- 字符编码 -->
    <meta charset="UTF-8">

    <!-- 手机适配 -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jensen Music</title>

    <!-- 主样式 -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">

    <meta name="theme-color" content="#07131d">

    <!-- iPhone PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <meta name="apple-mobile-web-app-title"
          content="Jensen MUSIC">

    <link rel="apple-touch-icon"
          href="./icons/icon-192.png">
	
	<link rel="icon" href="./icons/icon-192.png">

</head>

<body>

<!-- 背景层 -->
<div class="bg-overlay"></div>

<!-- 水印 -->
<div class="watermark-hidden">
    Jensen-Lone
</div>

<div class="layout">

    <!-- 左侧菜单 -->
    <aside class="sidebar">

        <!-- Logo -->
        <h1 id="logoBtn">
            Jensen Music
        </h1>

        <!-- 搜索框 -->
        <div class="search-box">
            <i class="fas fa-search"></i>

            <input
                    id="searchInput"
                    type="text"
                    placeholder="Search MUSIC">
        </div>

        <!-- 分类列表 -->
        <div id="genreList"></div>

    </aside>


    <!-- 主区域 -->
    <main class="main-content">

        <!-- 分类歌曲容器 -->
        <div id="categoryContainer"></div>

    </main>
	
	<!-- =========================
		歌词详情页（独立层）
		彻底脱离 main-content
		避免出现中间缝隙
	========================= -->
	<div id="lyricsPage" class="lyrics-page">

		<div class="lyrics-header">

			<button id="closeLyrics">

				<i class="fas fa-arrow-left"></i>

			</button>

			<span id="lyricsGenre">

			</span>

		</div>

		<div class="lyrics-content">

			<div class="lyrics-left">

				<img id="lyricsCover">

				<div class="lyrics-info">

					<h2 id="lyricsTitle"></h2>

					<p id="lyricsArtist"></p>

				</div>

			</div>

			<div class="lyrics-right">

				<div id="lyricsText">

				</div>

			</div>

		</div><!-- lyrics-content -->
		
		<div class="mobile-lyrics-player">

			<!-- 时间 -->
			<div class="mobile-time-wrap">

				<span id="mobileCurrentTime">
					00:00
				</span>

				<span id="mobileDuration">
					00:00
				</span>

			</div>
		
			<!-- 进度条 -->
			<input
				id="mobileLyricProgress"
				type="range"
				min="0"
				max="100"
				value="0">

			<div class="mobile-player-buttons">

				<button id="shareBtn">

					<i class="fas fa-share-alt"></i>

				</button>

				<button id="lyricPlayBtn">

					<i class="fas fa-play"></i>

				</button>

				<button id="lyricNextBtn">

					<i class="fas fa-forward"></i>

				</button>

			</div>

		</div>

	</div>

</div>


<!-- 底部播放器 -->
<div class="bottom-player"
     id="bottomPlayer">


    <!-- 左侧 -->
    <div class="player-left">

        <img id="playerCover">

        <div>
            <h3 id="playerTitle">
                Not Played
            </h3>

            <p id="playerArtist">
                Jensen-Lone
            </p>
        </div>

    </div>


    <!-- 中间 -->
    <div class="player-center">

        <!-- 控制按钮 -->
        <div class="controls">

            <button id="shuffleBtn">
                <i class="fas fa-random"></i>
            </button>

            <button id="prevBtn">
                <i class="fas fa-backward"></i>
            </button>

            <button id="playBtn">
                <i class="fas fa-play"></i>
            </button>

            <button id="nextBtn">
                <i class="fas fa-forward"></i>
            </button>

            <button id="repeatBtn">
                <i class="fas fa-repeat"></i>
            </button>

        </div>


        <!-- 进度条 -->
        <div class="progress-wrap desktop-only">

            <span id="currentTime">00:00</span>

            <input type="range"
                   id="progressBar"
                   value="0"
                   min="0"
                   max="100">

            <span id="duration">00:00</span>

        </div>

		
    </div>


    <!-- 右侧 -->
    <div class="player-right desktop-only">

        <!-- 音量 -->
        <button id="muteBtn">
            <i class="fas fa-volume-up"></i>
        </button>

        <input type="range"
               id="volumeBar"
               min="0"
               max="1"
               step="0.01"
               value="1">

    </div>

</div>



<!-- 音频 -->
<audio id="audioPlayer"
       preload="metadata">
</audio>


<!-- JS -->
<script src="./js/main.js"></script>

</body>
</html>
